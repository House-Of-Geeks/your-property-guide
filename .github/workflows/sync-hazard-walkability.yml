name: Data Sync — Hazard + Walkability + Climate (Annual)

on:
  #   schedule:
  #     - cron: "0 4 1 4 *"   # 04:00 UTC on 1 April each year

  workflow_dispatch:
    inputs:
      source:
        description: "Run one source only: hazard-flood, hazard-bushfire, walkability or silo-climate (leave empty for all)"
        required: false
        default: ""

jobs:
  sync:
    name: Sync hazard, walkability and climate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SILO_API_EMAIL: ${{ secrets.SILO_API_EMAIL }}
      # Runners reach the database through Railway's public TCP proxy, which
      # can drop a connection silently: fail a hung query after 2 minutes so
      # the sync retries it (scripts/sync/db.ts).
      SYNC_QUERY_TIMEOUT_MS: "120000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Sync flood hazard (GA AFRIP WFS)
        if: ${{ inputs.source == '' || inputs.source == 'hazard-flood' }}
        run: npx tsx scripts/sync/run.ts hazard-flood
        continue-on-error: true
      - name: Sync bushfire hazard (state GeoJSON sources)
        if: ${{ inputs.source == '' || inputs.source == 'hazard-bushfire' }}
        run: npx tsx scripts/sync/run.ts hazard-bushfire
        continue-on-error: true
      - name: Sync walkability scores (Overpass API)
        if: ${{ inputs.source == '' || inputs.source == 'walkability' }}
        run: npx tsx scripts/sync/run.ts walkability
        continue-on-error: true
      # SILO DataDrill, ~12k requests at one a second (about 3.5 hours).
      # Resumable: run it again if the job time limit cuts it off.
      - name: Sync climate averages (SILO)
        if: ${{ inputs.source == '' || inputs.source == 'silo-climate' }}
        run: npx tsx scripts/sync/run.ts silo-climate
        continue-on-error: true
