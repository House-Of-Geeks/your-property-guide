# Daily production deploy. vercel.json sets git.deploymentEnabled.main = false,
# so merges to main no longer deploy straight away. Each new production
# deployment starts with an empty ISR cache, so batching merges into one
# deploy a day cuts ISR writes and origin transfer.
#
# Once a day this job checks whether main has moved since the last successful
# Production deployment and, if it has, calls the Vercel Deploy Hook
# (repository secret VERCEL_DEPLOY_HOOK_URL, hook "daily-production" on main).
#
# Deploy now: Actions > "Daily production deploy" > Run workflow, or
#   gh workflow run daily-deploy.yml -R House-Of-Geeks/your-property-guide
# A manual run deploys even when nothing changed (force defaults to true).
name: Daily production deploy

on:
  schedule:
    - cron: "0 16 * * *"   # 03:00 AEDT / 02:00 AEST
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if main has not changed since the last production deploy"
        type: boolean
        default: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: daily-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)
          LAST_SHA=""
          for row in $(gh api "repos/$REPO/deployments?environment=Production&per_page=20" --jq '.[] | "\(.id):\(.sha)"'); do
            id=${row%%:*}; sha=${row#*:}
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then LAST_SHA=$sha; break; fi
          done
          echo "main=$HEAD_SHA last_production=${LAST_SHA:-none} force=$FORCE"
          if [ "$FORCE" = "true" ] || [ "$HEAD_SHA" != "$LAST_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has not changed since the last production deploy, skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the Vercel Deploy Hook
        if: steps.check.outputs.deploy == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL secret is missing"; exit 1; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Production deploy of main requested."
